# Compatibility rules: specify combos to avoid.
# Each rule: {component_a, value_a, component_b, value_b}
compatibility_exclusions:
  - component_a: "eyes"
    value_a: "closed eyes"
    component_b: "expression"
    value_b: "surprised"
  - component_a: "eyes"
    value_a: "closed eyes"
    component_b: "expression"
    value_b: "wide eyes"
  - component_a: "mouth"
    value_a: "open mouth"
    component_b: "expression"
    value_b: "serious"
  - component_a: "mouth"
    value_a: "fang"
    component_b: "expression"
    value_b: "crying"

pose_tokens:
